<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>WarpX Studio</title>
<style>
  :root { --bg:#14161c; --panel:#1c1f27; --line:#2c3140; --fg:#e6e8ee; --dim:#9aa3b5;
          --acc:#4a9eff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); height:100vh; display:grid;
         grid-template-columns:190px 1fr 420px; grid-template-rows:auto 1fr;
         grid-template-areas:"head head head" "nav form side"; }
  header { grid-area:head; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
           padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header input, header select { background:#0f1116; color:var(--fg); border:1px solid var(--line);
           border-radius:5px; padding:3px 6px; }
  button { background:#262b36; color:var(--fg); border:1px solid var(--line);
           border-radius:5px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#06101f; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  nav { grid-area:nav; padding:8px; border-right:1px solid var(--line); overflow:auto; }
  nav button { display:block; width:100%; text-align:left; margin-bottom:5px; }
  nav button.active { border-color:var(--acc); color:var(--acc); }
  main { grid-area:form; overflow:auto; padding:10px 14px; }
  aside { grid-area:side; border-left:1px solid var(--line); display:flex;
          flex-direction:column; overflow:hidden; }
  section.group { border:1px solid var(--line); border-radius:7px; margin-bottom:10px;
          background:var(--panel); }
  section.group > h3 { margin:0; padding:7px 10px; font-size:13px; cursor:pointer;
          border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .rows { padding:6px 10px 10px; }
  .row { display:grid; grid-template-columns:minmax(210px,1fr) 1.1fr; gap:8px;
         align-items:center; padding:2px 0; }
  .row label { color:var(--dim); font-size:13px; }
  .row label b { color:var(--fg); font-weight:500; }
  .row input { background:#0f1116; color:var(--fg); border:1px solid var(--line);
         border-radius:4px; padding:3px 6px; width:100%; font-family:ui-monospace,monospace; }
  .row .hint { grid-column:1/-1; color:var(--dim); font-size:12px; margin:-2px 0 6px; }
  .badge { font-size:11px; color:var(--warn); border:1px solid var(--warn);
           border-radius:4px; padding:0 4px; margin-left:6px; }
  .card { border:1px dashed var(--line); border-radius:6px; padding:8px; margin:8px 0; }
  .card header { display:flex; gap:8px; align-items:center; padding:0 0 6px; all:unset;
                 display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .warn { margin:10px 0; padding:8px 10px; border-radius:6px; font-size:13px; }
  .warn.bad { background:#3a1d1d; border:1px solid var(--err); }
  .warn.tip { background:#2a2416; border:1px solid var(--warn); }
  #live { width:100%; background:#000; min-height:200px; object-fit:contain; }
  #meta { font-size:12px; color:var(--dim); padding:4px 8px; }
  #log { flex:1; margin:0; padding:8px; overflow:auto; font-size:11.5px; color:#c9d1d9;
         background:#0d0f13; border-top:1px solid var(--line); white-space:pre-wrap; }
  #status { margin-left:auto; display:flex; gap:12px; align-items:center; font-size:13px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  progress { width:150px; height:8px; }
</style>
</head>
<body>
<header>
  <select id="dims" title="维度：切换后按该维度重建起步模板并过滤二进制">
    <option value="1d">1D</option><option value="2d" selected>2D</option>
    <option value="3d">3D</option><option value="rz">RZ</option>
  </select>
  <select id="binary" title="选择可执行文件（文件名里带构建特性）"></select>
  <label>MPI <input id="mpi" type="number" min="1" value="1" style="width:52px"></label>
  <label>线程 <input id="omp" type="number" min="1" value="1" style="width:52px"></label>
  <label>实时场 <select id="livefield"><option>rho</option><option>E</option><option>B</option></select></label>
  <select id="livecomp"><option value="">-</option><option>x</option><option>y</option><option>z</option></select>
  <button id="run" class="primary">▶ 运行</button>
  <button id="stop" disabled>■ 停止</button>
  <button id="pause" disabled>⏸ 暂停</button>
  <button id="resume" disabled>▶ 继续</button>
  <select id="project" title="已保存的任务（项目）"></select>
  <button id="project-new" title="新建任务">＋ 新建</button>
  <button id="project-save" title="保存当前任务（同名覆盖）">💾 保存</button>
  <button id="project-saveas" title="另存为新任务">另存为</button>
  <button id="project-delete" title="删除当前任务">🗑</button>
  <span id="project-state" style="font-size:12px;color:var(--dim)">未保存</span>
  <label style="font-size:12px;color:var(--dim)" title="派生/别名的参数默认折叠，勾选后显示">
    <input type="checkbox" id="show-derived"> 显示派生参数</label>
  <button id="preview" title="查看生成的输入文件">📄 输入文件</button>
  <button id="paraview" title="在网页内交互查看（旋转/缩放/回放），不再弹外部窗口">🔍 网页内查看</button>
  <button id="paraview-ext" title="导出 .vti/.pvd 并打开外部 ParaView（WSLg 下窗口按钮可能关不掉，用右边强制关闭）">↗ 外部 ParaView</button>
  <button id="paraview-close" title="强制杀掉所有 ParaView 进程（外部窗口关不掉时用这个）">✕ 关闭 ParaView</button>
  <select id="checkpoint" title="从某个 checkpoint 继续算"><option value="">（无 checkpoint）</option></select>
  <button id="restart" title="把选中 checkpoint 设为 amr.restart 并运行">⏩ 续算</button>
  <span id="status"><span class="dot" style="background:var(--dim)"></span>空闲</span>
</header>

<nav>
  <button data-step="1" class="active">1 网格与边界</button>
  <button data-step="2">2 粒子/激光/碰撞</button>
  <button data-step="3">3 场与外场</button>
  <button data-step="4">4 诊断输出</button>
  <button data-step="5">5 全部（按物理分类）</button>
  <button data-step="6">6 插件</button>
  <button data-step="7">7 构建</button>
</nav>

<main>
  <div id="warn"></div>
  <div id="form"></div>
</main>

<aside>
  <div style="display:flex;gap:4px;flex-wrap:wrap;padding:6px;font-size:12px;align-items:center">
    <span style="color:var(--dim)">场:</span>
    <label><input type="checkbox" class="livefield" value="rho" checked> rho</label>
    <label><input type="checkbox" class="livefield" value="E"> E</label>
    <label><input type="checkbox" class="livefield" value="B"> B</label>
    <label><input type="checkbox" id="liveparticles"> 粒子</label>
    <select id="liveiter" title="回放历史迭代"><option value="">跟随最新</option></select>
    <button id="liveapply">应用</button>
    <button id="export">导出帧序列</button>
  </div>
  <div id="livegrid" style="display:grid;grid-template-columns:1fr;gap:4px;padding:0 6px"></div>
  <section id="replay" style="padding:8px 6px;border-top:1px solid var(--line);margin-top:8px">
    <h3 style="margin:0 0 6px">回放与图片</h3>
    <div style="display:flex;gap:6px;align-items:center;font-size:12px;flex-wrap:wrap">
      <label>物理量
        <select id="rp-field"><option value="">（运行后自动列出）</option></select>
      </label>
      <label id="rp-comp-label">分量
        <select id="rp-comp"></select>
      </label>
      <label><input type="checkbox" id="rp-particles" checked> 叠加粒子</label>
    </div>
    <div style="margin-top:6px">
      <input type="range" id="rp-slider" min="0" max="0" value="0" style="width:100%"
             title="拖动查看不同时刻的可视化">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)">
        <span id="rp-iter">—</span><span id="rp-count">—</span>
      </div>
    </div>
    <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;font-size:12px">
      <button id="rp-reset" title="重置视角">⟳ 重置</button>
      <button id="rp-zoom-in" title="放大">＋</button>
      <button id="rp-zoom-out" title="缩小">－</button>
      <button id="rp-top" title="俯视（沿视图轴）">俯视</button>
      <button id="rp-iso" title="斜视（默认 3/4 视角）">斜视</button>
      <span style="color:var(--dim);align-self:center">拖动旋转 · 滚轮缩放 · Shift+拖动平移</span>
    </div>
    <div id="rp-image-wrap" style="margin-top:6px;text-align:center">
      <img id="rp-image" alt="回放画面" style="max-width:100%;background:#000;display:none">
      <div id="rp-empty" style="color:var(--dim);font-size:12px">尚无回放画面</div>
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <input id="rp-name" placeholder="图片名称（留空自动命名）"
             style="flex:1;background:#0f1116;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 6px">
      <button id="rp-save">💾 保存图片</button>
    </div>
    <div id="rp-gallery" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px"></div>
  </section>
  <div id="meta">尚未开始计算</div>
  <pre id="log"></pre>
</aside>

<script>
const STEP_CATEGORIES = {
  1: ["mesh", "boundary", "eb"],
  2: ["species", "laser", "collision"],
  3: ["solver", "extern"],
  4: ["diag"],
  5: null,
};
const STEP_GROUPS = {
  1: ["geometry", "amr", "boundary", "(root)"],
  2: ["particles", "<species_name>"],
  3: ["algo", "warpx", "psatd", "hybrid_pic_model"],
  4: ["diagnostics", "<diag_name>", "<reduced_diags_name>", "collisions", "<collision_name>"],
  5: null,
};
const TEMPLATE_ALIAS = { "<species>": "<species_name>" };
const TEMPLATE_BASE = { "<species_name>": "species", "<collision_name>": "collision",
  "<diag_name>": "diag", "<reduced_diags_name>": "rdiag", "<laser_name>": "laser",
  "<solver_name>": "solver" };
let CATALOG = null, ZH = null, DECK = { params: {}, groups: {} }, STEP = 1, BINARIES = [];
let CONTROLS = { field_bc: [], particle_bc: [], boundary_keys: {}, templates: {} };
let CATALOG_CATEGORIES = [], PARAM_BY_NAME = {}, ENUMS = {};
let GLOSSARY = {}, DERIVED = {}, SHOW_DERIVED = false, HINTS = {};
let PROJECT_NAME = "", PROJECT_SAVED_AT = "", DIRTY = true;

function markDirty() {
  DIRTY = true;
  const el = document.getElementById("project-state");
  if (el) { el.style.color = "var(--warn)"; el.textContent = "未保存"; }
}
function markSaved(at) {
  DIRTY = false; PROJECT_SAVED_AT = at || "";
  const el = document.getElementById("project-state");
  if (el) { el.style.color = "var(--ok)"; el.textContent = "已保存 " + (at || "").slice(11, 19); }
}
function deckSettings() {
  return {
    binary: document.getElementById("binary").value,
    mpi: Number(document.getElementById("mpi").value) || 1,
    omp: Number(document.getElementById("omp").value) || 1,
    live_fields: [...document.querySelectorAll(".livefield:checked")].map(x => x.value),
    live_particles: document.getElementById("liveparticles")?.checked ? ["electrons"] : [],
  };
}
function applySettings(settings) {
  if (!settings) return;
  if (settings.binary) document.getElementById("binary").value = settings.binary;
  if (settings.mpi) document.getElementById("mpi").value = settings.mpi;
  if (settings.omp) document.getElementById("omp").value = settings.omp;
  if (settings.live_particles) document.getElementById("liveparticles").checked = settings.live_particles.length > 0;
}

async function refreshProjects(selectName) {
  const data = await (await fetch("/api/projects")).json();
  const select = document.getElementById("project");
  select.innerHTML = '<option value="">（未命名任务）</option>';
  for (const p of data.projects) {
    const o = document.createElement("option");
    o.value = p.name;
    o.textContent = `${p.name} · ${p.dims}D · ${p.species} 物种 · ${(p.updated || "").slice(5, 16)}`;
    o.title = p.notes || "";
    select.appendChild(o);
  }
  if (selectName) select.value = selectName;
  return data;
}

async function loadProject(name) {
  const data = await (await fetch("/api/projects/" + encodeURIComponent(name))).json();
  DECK.params = data.deck.params || {};
  DECK.groups = data.deck.groups || {};
  PROJECT_NAME = data.name;
  applySettings(data.settings || {});
  document.getElementById("project").value = data.name;
  render();
  markSaved(data.updated);
  setStatus("已打开任务：" + data.name, "var(--ok)");
}

async function saveProject(name) {
  const preview = await (await fetch("/api/preview", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(DECK) })).json();
  const r = await fetch("/api/projects", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, deck: DECK, settings: deckSettings(), inputs: preview.inputs }) });
  const out = await r.json();
  if (!r.ok) { setStatus("保存失败: " + (out.detail || ""), "var(--err)"); return false; }
  PROJECT_NAME = name;
  await refreshProjects(name);
  markSaved(out.updated);
  setStatus("已保存：" + name, "var(--ok)");
  return true;
}
function axisLabels() {
  const raw = String(DECK.params["geometry.dims"] || "2").trim().toUpperCase();
  const axes = (CONTROLS.axes || {})[raw];
  if (axes) return axes;                    // 后端给定的唯一标准：1D=z，2D=x-z，3D=x-y-z，RZ=r-z
  if (raw === "1") return ["z"];
  if (raw === "3") return ["x", "y", "z"];
  return ["x", "z"];
}
const NDIMS = () => axisLabels().length;
const isExpressionKey = (name) => /\(x\s*,\s*y\s*,\s*z\)$/.test(name) || name.endsWith("_function");

const groupOf = (name) => {
  if (name.startsWith("<")) return name.split(">")[0] + ">";
  return name.includes(".") ? name.split(".")[0] : "(root)";
};
const paramsOf = (group) => CATALOG.params.filter(p => groupOf(p.name) === group);
const label = (name) => ZH.params[name] || name.split(".").slice(-1)[0];
const docOf = (name) => (CATALOG.params.find(p => p.name === name) || {}).doc || "";
const typeOf = (name) => (CATALOG.params.find(p => p.name === name) || {}).type || "";
const guardOf = (name) => (CATALOG.build_guards || {})[name] || [];

function deckGet(name) {
  if (DECK.params[name] !== undefined) return DECK.params[name];
  const m = name.match(/^<[a-z_]+>\.(.+)$/);
  if (m) {
    const inst = Object.values(DECK.groups[name.split(".")[0].replace(">.", ">")] || {});
    for (const v of inst) if (v[m[1]] !== undefined) return v[m[1]];
  }
  return "";
}
function ruleSatisfied(rule, instance) {
  let param = rule.param;
  if (instance && param.startsWith("<")) param = param.replace(/^<[a-z_]+>/, instance);
  const value = String(deckGet(param)).replace(/"/g, "").trim().toLowerCase();
  if (rule.op === "truthy") return ["1", "true", "t", "yes"].includes(value);
  if (rule.op === "falsy") return !["1", "true", "t", "yes"].includes(value);
  return value === String(rule.value).toLowerCase();
}
function hiddenAsDerived(name) {
  return !SHOW_DERIVED && Object.prototype.hasOwnProperty.call(DERIVED, name);
}

function visible(name, instance) {
  if (hiddenAsDerived(name)) return false;
  const rules = (CATALOG.gating_rules || {})[name];
  if (!rules || !rules.length) return true;
  return rules.some(r => ruleSatisfied(r, instance));
}

function inputRow(name, value, onchange, instance) {
  const wrap = document.createElement("div");
  wrap.className = "row";
  const type = typeOf(name), guard = guardOf(name), zh = ZH.params[name];
  const lab = document.createElement("label");
  lab.innerHTML = `<b>${name.split(".").slice(innerInstance(name) ? 1 : 0).join(".") || name}</b>` +
    `<br><span style="font-size:12px;color:var(--dim)">${zh || type || ""}</span>`;
  lab.title = (zh ? zh + "\n\n" : "") + docOf(name) + (type ? `\n类型: ${type}` : "") +
    (guard.length ? `\n构建条件: ${guard.join("; ")}` : "");
  const box = document.createElement("div");
  if (CONTROLS.boundary_keys && CONTROLS.boundary_keys[name]) {
    const kind = CONTROLS.boundary_keys[name];
    const choices = kind === "field" ? CONTROLS.field_bc : CONTROLS.particle_bc;
    const current = String(value || "").trim().split(/\s+/);
    const parts = [];
    const labels = axisLabels();
    for (let i = 0; i < NDIMS(); i++) {
      const select = document.createElement("select");
      select.style.cssText = "background:#0f1116;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 4px;margin-right:4px";
      for (const option of choices) {
        const e = document.createElement("option");
        e.value = option; e.textContent = `${labels[i]}: ${option}`;
        select.appendChild(e);
      }
      const initial = current[i] || "periodic";
      if (!choices.includes(initial)) {
        const e = document.createElement("option"); e.value = initial; e.textContent = `${labels[i]}: ${initial}`;
        select.appendChild(e);
      }
      select.value = initial;
      parts.push(select);
    }
    const commit = () => onchange(parts.map(x => x.value).join(" "));
    parts.forEach(x => { x.onchange = () => { commit(); markDirty(); }; box.appendChild(x); });
    wrap.append(lab, box);
    return wrap;
  }
  if (isExpressionKey(name)) {
    const area = document.createElement("textarea");
    area.value = value || "";
    area.rows = 2;
    area.style.cssText = "width:100%;background:#0f1116;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px;font-family:ui-monospace,monospace";
    area.oninput = () => { onchange(area.value); markDirty(); scheduleValidate(); };
    const bar = document.createElement("div");
    bar.style.cssText = "display:flex;gap:6px;margin-top:4px;align-items:center";
    const tpl = document.createElement("select");
    tpl.style.cssText = "background:#0f1116;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 4px";
    tpl.innerHTML = '<option value="">插入模板…</option>' +
      Object.keys(CONTROLS.templates || {}).map(k => `<option value="${k}">${k}</option>`).join("");
    tpl.onchange = () => {
      if (!tpl.value) return;
      area.value = CONTROLS.templates[tpl.value];
      onchange(area.value); scheduleValidate();
    };
    const check = document.createElement("button");
    check.textContent = "检查表达式";
    const verdict = document.createElement("span");
    verdict.style.cssText = "font-size:12px";
    check.onclick = async () => {
      const constants = Object.keys(DECK.params)
        .filter(k => k.startsWith("my_constants.")).map(k => k.slice("my_constants.".length));
      const r = await fetch("/api/expression/check", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: area.value, constants }) });
      const out = await r.json();
      if (out.problems.length) { verdict.style.color = "var(--err)"; verdict.textContent = out.problems.join("；"); }
      else if (out.warnings.length) { verdict.style.color = "var(--warn)"; verdict.textContent = out.warnings[0]; }
      else { verdict.style.color = "var(--ok)"; verdict.textContent = "语法 OK"; }
    };
    bar.append(tpl, check, verdict);
    box.append(area, bar);
    wrap.append(lab, box);
    return wrap;
  }
  let options = (CATALOG.params.find(p => p.name === name) || {}).options || [];
  if (!options.length) options = ENUMS[name] || [];
  if (!options.length && name.endsWith("_init_style")) {
    options = (name.includes("particle") ? (CONTROLS.style_options || {}).particle
                                         : (CONTROLS.style_options || {}).grid) || [];
  }
  let inp;
  if (options.length) {
    inp = document.createElement("select");
    inp.style.cssText = "background:#0f1116;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:100%";
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "（未设置）";
    inp.appendChild(blank);
    const gloss = GLOSSARY[name] || {};
    for (const opt of [...new Set([...options, ...(value ? [value] : [])])]) {
      const e = document.createElement("option"); e.value = opt; e.textContent = opt;
      if (gloss[opt]) e.title = gloss[opt];
      inp.appendChild(e);
    }
    inp.value = value || "";
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:11.5px;color:var(--dim);margin-top:2px;min-height:14px";
    const showHint = () => { hint.textContent = gloss[inp.value] ? "· " + gloss[inp.value] : ""; };
    showHint();
    inp.onchange = () => { onchange(inp.value); showHint(); markDirty(); scheduleValidate(); };
  } else {
    inp = document.createElement("input");
    inp.value = value || "";
    const param = CATALOG.params.find(p => p.name === name) || {};
    inp.placeholder = exampleFor(param, type);
    inp.oninput = () => { onchange(inp.value); markDirty(); scheduleValidate(); };
  }
  box.appendChild(inp);
  if (HINTS[name]) {
    const valueHint = document.createElement("div");
    valueHint.className = "hint";
    valueHint.textContent = HINTS[name];
    box.appendChild(valueHint);
  }
  if (guard.length) { const b = document.createElement("span"); b.className = "badge";
    b.textContent = "构建条件"; b.title = guard.join("; "); lab.appendChild(b); }
  const rules = (CATALOG.gating_rules || {})[name];
  if (rules) { const b = document.createElement("span"); b.className = "badge";
    b.textContent = "条件"; b.title = rules.map(r => r.raw).join("\n"); lab.appendChild(b); }
  wrap.append(lab, box);

}

// grey example inside the box: the documented default when there is one, else a
// type-appropriate sample so an empty field still says what to type
function exampleFor(param, type) {
  const axes = axisLabels();
  if (param.name === "amr.n_cell") return "例如 " + axes.map(() => 64).join(" ") + "（" + axes.join(" ") + "）";
  if (param.name === "geometry.prob_lo" || param.name === "geometry.prob_hi")
    return "例如 " + axes.map(() => "0.0").join(" ") + "（" + axes.join(" ") + "）";
  if (param.name && param.name.startsWith("boundary.") && param.name.includes("_lo") === false
      && param.name.endsWith("_hi") === false && !param.name.includes("particle"))
    return "例如 " + axes.map(() => "periodic").join(" ");
  const t = String(type || "").toLowerCase();
  const fallback = t.includes("int") && t.includes("list") ? "例如 64 64"
    : t.includes("int") ? "例如 10"
    : t.includes("float") || t.includes("real") ? "例如 1.0e-6"
    : t.includes("string") || t.includes("strings") ? "例如 periodic"
    : "例如 1";
  const def = param.default;
  if (def !== null && def !== undefined && String(def).trim() !== "") {
    const text = String(def).trim();
    return text.length > 34 ? "默认 " + text.slice(0, 34) + "…" : "默认 " + text;
  }
  if (param.options && param.options.length) return "选择其一，例如 " + param.options[0];
  return fallback;
}

function renderTemplateCards(template, params, body) {
  // 源码里 <species> 与 <species_name> 是同一个命名空间，统一成后者
  const key = TEMPLATE_ALIAS[template] || template;
  const instances = DECK.groups[key] = DECK.groups[key] || {};
  for (const [inst, values] of Object.entries(instances)) {
    const card = document.createElement("div");
    card.className = "card";
    const bar = document.createElement("div");
    bar.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:6px";
    const title = document.createElement("input");
    title.value = inst;
    title.style.cssText = "background:#0f1116;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 6px";
    title.onchange = () => {
      if (!title.value || title.value === inst) return;
      DECK.groups[key][title.value] = DECK.groups[key][inst];
      delete DECK.groups[key][inst];
      render();
    };
    const del = document.createElement("button");
    del.textContent = "× 删除";
    del.onclick = () => { delete instances[inst]; render(); };
    bar.append(document.createTextNode(template.replace(/[<>]/g, "")), title, del);
    card.appendChild(bar);
    for (const full of params) {
      const sub = full.slice(template.length + 1);
      if (!visible(full, inst)) continue;
      card.appendChild(inputRow(full, values[sub],
        v => { DECK.groups[key][inst] = DECK.groups[key][inst] || {};
               DECK.groups[key][inst][sub] = v; }, inst));
    }
    body.appendChild(card);
  }
  const add = document.createElement("button");
  add.textContent = `+ 新增一张 ${(ZH.sections[key] || key)}`;
  add.onclick = () => {
    const base = TEMPLATE_BASE[key] || "item";
    let n = 1; while (DECK.groups[key][base + n]) n++;
    DECK.groups[key][base + n] = {};
    render();
  };
  body.appendChild(add);
}

function render() {
  if (STEP === 6) { renderPlugins(); return; }
  if (STEP === 7) { renderBuild(); return; }
  const form = document.getElementById("form");
  form.innerHTML = "";
  const wanted = STEP_CATEGORIES[STEP];
  const categories = CATALOG_CATEGORIES.length
    ? CATALOG_CATEGORIES
    : [{ id: "all", name: "全部参数", params: CATALOG.params.map(p => p.name) }];
  for (const category of categories) {
    if (wanted && !wanted.includes(category.id)) continue;
    const names = category.params.filter(n => PARAM_BY_NAME[n]);
    if (!names.length) continue;
    const sec = document.createElement("section");
    sec.className = "group";
    const head = document.createElement("h3");
    head.innerHTML = `<span>${category.name}</span><span style="color:var(--dim)">${names.length} 项</span>`;
    const body = document.createElement("div");
    body.className = "rows";
    head.onclick = () => { body.style.display = body.style.display === "none" ? "" : "none"; };
    sec.append(head, body);

    const byTemplate = new Map();
    for (const name of names.filter(n => n.startsWith("<"))) {
      const raw = name.split(">")[0] + ">";
      const key = TEMPLATE_ALIAS[raw] || raw;
      if (!byTemplate.has(key)) byTemplate.set(key, { prefix: raw, params: [] });
      byTemplate.get(key).params.push(name);
    }
    for (const [key, entry] of byTemplate) {
      renderTemplateCards(entry.prefix, entry.params, body);
    }
    for (const name of names.filter(n => !n.startsWith("<"))) {
      if (!visible(name)) continue;
      body.appendChild(inputRow(name, DECK.params[name], v => { DECK.params[name] = v; }));
    }
    form.appendChild(sec);
  }
  validate();
}

let VALIDATE_TIMER = null, LAST_ISSUES = [];
function scheduleValidate() {
  clearTimeout(VALIDATE_TIMER);
  VALIDATE_TIMER = setTimeout(runValidation, 350);

async function runValidation() {
  try {
    const r = await fetch("/api/validate", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(DECK) });
    const data = await r.json();
    LAST_ISSUES = data.issues || [];
    const errors = LAST_ISSUES.filter(i => i.severity === "error");
    const warn = document.getElementById("warn");
    warn.innerHTML = LAST_ISSUES.filter(i => i.severity !== "info")
      .map(i => `<div class="warn ${i.severity === "error" ? "bad" : "tip"}"><b>${i.param}</b> — ${i.message}` +
                (i.options && i.options.length ? `（可选值: ${i.options.join(" / ")}）` : "") + `</div>`)
      .join("");
    document.getElementById("run").disabled = errors.length > 0;
  } catch (e) { /* offline */ }
}

function validate() {
  const warn = document.getElementById("warn");
  const msgs = [];
  const diags = DECK.groups["<diag_name>"] || {};
  for (const [name, values] of Object.entries(diags)) {
    if ((values.format || "").toLowerCase() === "openpmd" && !values.intervals && !values.period)
      msgs.push({ tip: `${name}: format=openpmd 但没有设置 intervals，实时图不会随计算更新。` });
  }
  const ncell = (DECK.params["amr.n_cell"] || "").trim().split(/\s+/).map(Number);
  const cells = ncell.filter(n => n > 0).reduce((a, b) => a * b, 1);
  if (cells > 4_000_000) msgs.push({ bad: `网格 ${cells.toLocaleString()} 个点，内存可能很大（先小网格跑通）。` });
  if (!DECK.params["max_step"] && !DECK.params["stop_time"])
    msgs.push({ tip: "没有设置 max_step 或 stop_time，仿真会一直跑。" });
  if (msgs.length) {
    warn.innerHTML = msgs.map(m => `<div class="warn ${m.bad ? "bad" : "tip"}">${m.bad || m.tip}</div>`).join("");
  }
  scheduleValidate();
}

async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    if (s.state === "idle") return;
    const running = s.state === "running", paused = s.state === "paused";
    document.getElementById("run").disabled = running || paused;
    document.getElementById("stop").disabled = !(running || paused);
    document.getElementById("pause").disabled = !running;
    document.getElementById("resume").disabled = !paused;
    const max = s.max_step ? `/${s.max_step}` : "";
    const pct = s.max_step ? Math.min(100, 100 * s.step / s.max_step) : 0;
    setStatus(`${s.state} · step ${s.step}${max} · t=${s.time.toExponential(2)} s · ${s.elapsed}s`,
      running ? "var(--ok)" : paused ? "var(--warn)" : s.state === "finished" ? "var(--acc)" : "var(--err)");
    const bar = document.getElementById("pbar");
    document.getElementById("log").textContent = (s.log || []).join("\n");
    if (s.errors && s.errors.length) {
      const d = (s.diagnosis && s.diagnosis[0]) || null;
      setStatus(d && d.param ? `失败: ${d.param} — ${(d.hint || d.message).slice(0, 80)}`
                             : `失败: ${s.errors[0].slice(0, 80)}`, "var(--err)");
    }
    const live = s.live || {};
    document.getElementById("meta").textContent = live.meta && live.meta.summary
      ? live.meta.summary + (live.meta.ok ? "" : "（渲染失败）") : "等待第一个输出迭代…";
    if (live.frames && live.frames.length) {
      const grid = document.getElementById("livegrid");
      if (grid.childElementCount !== live.frames.length) {
        grid.innerHTML = live.frames.map(f => `<img alt="${f.field}" style="width:100%;background:#000">`).join("");
      }
      live.frames.forEach((f, i) => {
        const img = grid.children[i];
        if (img && f.png) img.src = "/api/frame?field=" + encodeURIComponent(f.field) + "&t=" + Date.now();
      });
    }
  } catch (e) { /* keep polling */ }
  setTimeout(poll, 1200);
}

const QUANTITY_LABEL = {
  rho: "电荷密度 rho（标量）",
  E: "电场 E（矢量）",
  B: "磁场 B（矢量）",
  j: "电流密度 j（矢量）",
};
function quantityLabel(q) {

}

// 物理量直接从输出里枚举：标量（如 rho）没有分量，不显示分量下拉。
function fillQuantitySelect() {
  const field = document.getElementById("rp-field");
  const comp = document.getElementById("rp-comp");
  const compLabel = document.getElementById("rp-comp-label");

    o.textContent = quantityLabel(q);

function currentQuantity() {

function rpQuery() {
  const field = document.getElementById("rp-field").value;
  const q = currentQuantity();
  const comp = (q && q.ncomp > 1) ? document.getElementById("rp-comp").value : "";
  const parts = document.getElementById("rp-particles").checked ? "electrons" : "";
  return { field, comp, parts };
}
const RP_CAM = { az: 0, el: 0, zoom: 1, px: 0, pz: 0 };

function rpFrameUrl(iteration) {
  const { field, comp, parts } = rpQuery();
  const params = new URLSearchParams({ field, iteration: String(iteration) });
  if (comp) params.set("component", comp);
  if (parts) params.set("particles", parts);
  if (RP_CAM.az) params.set("az", RP_CAM.az.toFixed(1));
  if (RP_CAM.el) params.set("el", RP_CAM.el.toFixed(1));
  if (RP_CAM.zoom !== 1) params.set("zoom", RP_CAM.zoom.toFixed(3));
  if (RP_CAM.px) params.set("px", RP_CAM.px.toFixed(4));
  if (RP_CAM.pz) params.set("pz", RP_CAM.pz.toFixed(4));
  params.set("t", String(Date.now()));
  return "/api/frame?" + params.toString();
}

// ---- 鼠标交互：拖动旋转、Shift+拖动平移、滚轮缩放（全部在网页内完成）----
(function () {
  const img = document.getElementById("rp-image");
  let dragging = false, mode = "rotate", lastX = 0, lastY = 0;
  img.style.cursor = "grab";
  img.addEventListener("mousedown", (e) => {
    dragging = true; mode = e.shiftKey ? "pan" : "rotate";
    lastX = e.clientX; lastY = e.clientY;
    img.style.cursor = "grabbing";
    e.preventDefault();
  });
  window.addEventListener("mouseup", () => { dragging = false; img.style.cursor = "grab"; });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (mode === "pan") {
      RP_CAM.px += dx / 400;
      RP_CAM.pz -= dy / 400;
    } else {
      RP_CAM.az += dx * 0.6;
      RP_CAM.el = Math.max(-89, Math.min(89, RP_CAM.el + dy * 0.6));
    }
    rpSchedule();
  });
  img.addEventListener("wheel", (e) => {
    e.preventDefault();
    RP_CAM.zoom = Math.max(0.2, Math.min(20, RP_CAM.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    rpSchedule();
  }, { passive: false });
})();
document.getElementById("rp-reset").onclick = () => {
  RP_CAM.az = RP_CAM.el = 0; RP_CAM.zoom = 1; RP_CAM.px = RP_CAM.pz = 0;
  rpShow(false);
};
document.getElementById("rp-zoom-in").onclick = () => {
  RP_CAM.zoom = Math.min(20, RP_CAM.zoom * 1.25); rpApplyCamera();
};
document.getElementById("rp-zoom-out").onclick = () => {
  RP_CAM.zoom = Math.max(0.2, RP_CAM.zoom / 1.25); rpApplyCamera();
};
document.getElementById("rp-top").onclick = () => {
  RP_CAM.az = RP_CAM.el = 0; RP_CAM.zoom = 1; rpShow(false);
};
document.getElementById("rp-iso").onclick = () => {
  RP_CAM.az = 35; RP_CAM.el = 25; rpShow(false);
};
document.getElementById("rp-save").onclick = async () => {
  const iter = RP_ITERS[RP_INDEX];
  if (iter === undefined) { setStatus("还没有可保存的画面", "var(--warn)"); return; }
  const { field, comp, parts } = rpQuery();
  let name = document.getElementById("rp-name").value.trim();
  if (!name) name = `${field}${comp || ""}_iter${iter}`;
  const body = { name, iteration: iter, field, component: comp || null,
                 particles: parts ? ["electrons"] : [] };
  const r = await fetch("/api/snapshots", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const out = await r.json();
  if (!r.ok) { setStatus("保存失败: " + (out.detail || ""), "var(--err)"); return; }
  document.getElementById("rp-name").value = "";
  refreshGallery();
  setStatus("已保存图片：" + name, "var(--ok)");
};

async function refreshIterations() {
  try {
    const data = await (await fetch("/api/live/iterations")).json();
    const select = document.getElementById("liveiter");
    const current = select.value;
    select.innerHTML = '<option value="">跟随最新</option>';
    for (const n of data.iterations.slice(-60)) {
      const o = document.createElement("option"); o.value = n; o.textContent = "iter " + n;
      select.appendChild(o);
    }
    if (current) select.value = current;
  } catch (e) { /* no run yet */ }
}
document.getElementById("show-derived").onchange = (e) => {
  SHOW_DERIVED = e.target.checked;
  render();
};
document.getElementById("project").onchange = async (e) => {
  const name = e.target.value;
  if (!name) { PROJECT_NAME = ""; markDirty(); return; }
  if (DIRTY && !confirm("当前改动尚未保存，仍要切换到 " + name + " 吗？")) {
    e.target.value = PROJECT_NAME; return;
  }
  await loadProject(name);
};
document.getElementById("project-new").onclick = async () => {
  const name = prompt("新任务名称：", "任务-" + new Date().toISOString().slice(5, 16).replace("T", " "));
  if (!name) return;
  const starter = await (await fetch("/api/starter?dims=" + document.getElementById("dims").value)).json();
  DECK.params = starter.params; DECK.groups = starter.groups;
  PROJECT_NAME = name; render();
  await saveProject(name);
};
document.getElementById("project-save").onclick = async () => {
  let name = PROJECT_NAME || document.getElementById("project").value;
  if (!name) { name = prompt("保存为任务名："); if (!name) return; }
  await saveProject(name);
};
document.getElementById("project-saveas").onclick = async () => {
  const name = prompt("另存为：", (PROJECT_NAME || "任务") + "-副本");
  if (name) await saveProject(name);
};
document.getElementById("project-delete").onclick = async () => {
  const name = PROJECT_NAME || document.getElementById("project").value;
  if (!name || !confirm("确定删除任务 " + name + " ？")) return;
  await fetch("/api/projects/" + encodeURIComponent(name), { method: "DELETE" });
  PROJECT_NAME = ""; await refreshProjects(); markDirty();
  setStatus("已删除：" + name, "var(--warn)");
};
document.getElementById("liveapply").onclick = async () => {
  const fields = [...document.querySelectorAll(".livefield:checked")].map(x => x.value);
  const particles = document.getElementById("liveparticles").checked ? ["electrons"] : [];
  const raw = document.getElementById("liveiter").value;
  const body = { fields, particles, follow: raw === "" };
  if (raw !== "") body.iteration = Number(raw);
  const r = await fetch("/api/live", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  setStatus(r.ok ? "实时视图已更新" : "更新失败", r.ok ? "var(--ok)" : "var(--err)");
};
document.getElementById("export").onclick = async () => {
  setStatus("正在导出帧序列…", "var(--warn)");
  const fields = [...document.querySelectorAll(".livefield:checked")].map(x => x.value);
  const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: fields.length ? fields : ["rho"], max_frames: 40,
                           particles: document.getElementById("liveparticles").checked ? ["electrons"] : [] }) });
  const out = await r.json();
  setStatus(r.ok ? `导出 ${out.count} 帧 → ${out.dir}${out.mp4 ? "（含 mp4）" : "（无 ffmpeg，仅 PNG）"}`
                 : "导出失败: " + (out.detail || ""), r.ok ? "var(--ok)" : "var(--err)");
};
document.getElementById("preview").onclick = async () => {
  const r = await fetch("/api/preview", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(DECK) });
  const out = await r.json();
  const win = window.open("", "_blank"); win.document.write("<pre>" + out.inputs.replace(/</g, "&lt;") + "</pre>");
};

function fillBinaries(dims) {
  const sel = document.getElementById("binary");
  sel.innerHTML = "";
  for (const b of BINARIES.filter(x => x.dims === dims)) {
    const o = document.createElement("option");
    o.value = b.path;
    o.textContent = `${b.build} · ${b.dims} · ${b.features.slice(0, 4).join(",")}`;
    sel.appendChild(o);
  }
  const preferred = BINARIES.find(b => b.dims === dims && b.build === "fork");
  if (preferred) sel.value = preferred.path;
  else if (sel.options.length) sel.selectedIndex = 0;
}

document.addEventListener("DOMContentLoaded", () => {});
async function switchDims(dims) {
  fillBinaries(dims);
  const starter = await (await fetch("/api/starter?dims=" + dims)).json();
  DECK.params = starter.params;
  DECK.groups = starter.groups;
  render();
  markDirty();
  setStatus(`已切到 ${dims.toUpperCase()}：模板与可用二进制已更新`, "var(--acc)");
}

(async function init() {
  const data = await (await fetch("/api/catalog")).json();
  CATALOG = data.catalog; ZH = data.zh;
  CATALOG_CATEGORIES = data.categories || [];
  ENUMS = data.enums || {};
  GLOSSARY = data.glossary || {};
  DERIVED = data.derived || {};
  HINTS = data.hints || {};
  PARAM_BY_NAME = Object.fromEntries(CATALOG.params.map(p => [p.name, p]));
  CONTROLS = await (await fetch("/api/controls")).json();
  const bins = await (await fetch("/api/binaries")).json();
  BINARIES = bins.binaries;
  fillBinaries(document.getElementById("dims").value);
  const projects = await refreshProjects();
  document.getElementById("dims").onchange = (e) => switchDims(e.target.value);
  if (projects.projects.length && projects.last) {
    try { await loadProject(projects.last); }
    catch (e) { await loadStarter(); render(); markDirty(); }
  } else {
    await loadStarter(); render(); markDirty();
  }
  refreshCheckpoints();
  setInterval(refreshCheckpoints, 5000);
  refreshIterations();
  setInterval(refreshIterations, 8000);
  refreshQuantities();
  refreshReplay();
  setInterval(refreshQuantities, 15000);
  setInterval(refreshReplay, 8000);
  refreshGallery();
})();
</script>
